<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FGAB - FlashGamesGameBoy Emulator</title>
    <style>
        body {
            background: #1a1a1a;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            background: #2d2d2d;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        h1 {
            margin-top: 0;
            color: #ffcc00;
            text-shadow: 2px 2px 0 #aa8800;
        }
        canvas {
            display: block;
            margin: 20px auto;
            width: 480px;        /* 3x scale */
            height: 432px;        /* 3x scale */
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 4px solid #444;
            border-radius: 8px;
            background: #000;
        }
        .info {
            margin: 20px 0;
            font-size: 0.9rem;
            color: #aaa;
        }
        .status {
            padding: 8px 16px;
            background: #3a3a3a;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
        }
        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #666;
        }
        a {
            color: #ffcc00;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        button {
            background: #ffcc00;
            border: none;
            color: #1a1a1a;
            font-weight: bold;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background: #ffdb4d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 FGAB Emulator</h1>
        <p>Play Game Boy ROMs (.gb) and Flash games (.swf) – no plugins required*</p>
        
        <!-- Game Boy display canvas -->
        <canvas id="gbCanvas" width="160" height="144"></canvas>
        
        <div class="status" id="status">⏳ Loading FGAB.js...</div>
        
        <div class="info">
            <p><strong>Current ROM:</strong> <span id="romName">pokemon-red.gb</span></p>
            <p><em>*Flash games require a browser with NPAPI support (deprecated).</em></p>
        </div>
        
        <button id="loadButton">Load Another ROM</button>
        <input type="file" id="fileInput" accept=".gb,.gbc,.swf" style="display: none;">
    </div>
    
    <div class="footer">
        <p>FGAB.js – Custom Game Boy / Flash emulator • <a href="https://github.com/yourname/fgab" target="_blank">GitHub</a></p>
    </div>

    <!-- Include our custom emulator -->
    <script src="FGAB.js"></script>
    <script>
        (function() {
            const canvas = document.getElementById('gbCanvas');
            const statusEl = document.getElementById('status');
            const romNameEl = document.getElementById('romName');
            const loadButton = document.getElementById('loadButton');
            const fileInput = document.getElementById('fileInput');

            let emulator = null;

            // Async function to load ROM from URL (or binary)
            async function loadROMFromUrl(url) {
                if (!emulator) emulator = new FGAB(canvas);
                statusEl.textContent = '⏳ Loading ROM...';
                romNameEl.textContent = url.split('/').pop();
                try {
                    await emulator.loadROM(url);
                    emulator.start();
                    statusEl.textContent = '✅ Running';
                } catch (e) {
                    statusEl.textContent = '❌ Error loading ROM';
                    console.error(e);
                }
            }

            // Try to load default ROM (update path to your actual ROM file)
            const defaultRom = 'roms/dude.gbc';
            // Attempt to load – if it fails, show a message and create emulator anyway
            loadROMFromUrl(defaultRom).catch(() => {
                statusEl.textContent = '⚠️ Default ROM not found. Use file picker.';
                romNameEl.textContent = '[none]';
                emulator = new FGAB(canvas);
            });

            // File picker: load local file
            fileInput.addEventListener('change', async (event) => {
                const file = event.target.files[0];
                if (!file) return;

                romNameEl.textContent = file.name;
                statusEl.textContent = '⏳ Loading local file...';

                if (!emulator) emulator = new FGAB(canvas);

                const ext = file.name.split('.').pop().toLowerCase();
                try {
                    if (ext === 'gb' || ext === 'gbc') {
                        const arrayBuffer = await file.arrayBuffer();
                        await emulator.loadROM(new Uint8Array(arrayBuffer));
                        emulator.start();
                        statusEl.textContent = '✅ Running';
                    } else if (ext === 'swf') {
                        // Flash is deprecated – pass as URL
                        const blobUrl = URL.createObjectURL(file);
                        await emulator.loadROM(blobUrl);
                        statusEl.textContent = '⚠️ Flash may not work in modern browsers';
                    } else {
                        statusEl.textContent = '❌ Unsupported file type';
                    }
                } catch (e) {
                    statusEl.textContent = '❌ Error loading ROM';
                    console.error(e);
                }
            });

            // Click button to open file dialog
            loadButton.addEventListener('click', () => {
                fileInput.click();
            });
        })();
    </script>
</body>
</html>
